<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  ENDEREÇO ANTIGO DA VITRINE — não apague este arquivo.

  Este era o site (worka.html) de 27/06 a 04/08/2026, quando foi
  renomeado para index.html. Cinco semanas no ar: o Google indexou, e
  quem recebeu o link por WhatsApp nesse período tem ele salvo. Sem
  este arquivo, essa pessoa cai na página de erro do GitHub — não numa
  página do Workap, na do GitHub, com a marca errada e sem caminho de
  volta.

  Aqui NÃO tem noindex, ao contrário do worka-app.html: esta era a
  vitrine, e o que se quer é que o Google leve o histórico deste
  endereço para a home em vez de descartá-lo.

  O GitHub Pages não faz redirecionamento de servidor (não há 301 para
  configurar), então a única forma é esta: uma página que manda o
  navegador embora na hora. O refresh com tempo 0 é lido pelo Google
  como redirecionamento permanente, e o canonical diz qual é o endereço
  bom — os dois juntos passam o histórico da página antiga para a nova
  em vez de deixá-la morrer como 404.

  O link visível embaixo não é enfeite: se o JavaScript ou o refresh
  falharem, ainda existe uma saída clicável em vez de tela branca.
-->
<meta http-equiv="refresh" content="0; url=https://workap.com.br/">
<link rel="canonical" href="https://workap.com.br/">
<title>Workap — este endereço mudou</title>
<style>
  body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#0a2e1a;color:#fff;
       display:flex;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;
       margin:0;padding:24px;text-align:center;line-height:1.6}
  a{color:#3dd669;font-weight:700}
</style>
</head>
<body>
  <div>
    <p>O endereço do Workap mudou.</p>
    <p><a href="https://workap.com.br/">Ir para workap.com.br</a></p>
  </div>
</body>
</html>
