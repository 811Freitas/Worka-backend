<!--
  Símbolo da Workap — o "W" em fita, sem a palavra "workap".

  Reconstruído em SVG de propósito, em vez de recortar o PNG da marca:
  o favicon é servido em 16px e o ícone do app em 512px, e um PNG que
  serve bem um tamanho fica borrado no outro. Em SVG o mesmo arquivo
  atende todos, e os PNGs de assets/ são gerados a partir daqui
  (assets/gerar-icones.js) para os lugares que não aceitam SVG —
  favicon de navegador antigo, ícone de PWA e notificação push.

  A proporção é ~2,4:1 (bem mais largo que alto). Onde o espaço é
  quadrado (ícone de app), o símbolo fica centralizado com respiro em
  cima e embaixo — é o formato da marca, não sobra de layout.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img" aria-label="Workap">
  <defs>
    <linearGradient id="wk-esq" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#54C436"/>
      <stop offset="1" stop-color="#31A32B"/>
    </linearGradient>
    <linearGradient id="wk-dir" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#0C7530"/>
      <stop offset="1" stop-color="#15883A"/>
    </linearGradient>

    <!--
      Máscara com o próprio traço da metade direita. A dobra da fita
      precisa terminar em corte reto no meio do traço, e clip-path do
      SVG só recorta por preenchimento, nunca por traço — com máscara
      o recorte segue exatamente a espessura e as pontas arredondadas.
    -->
    <mask id="wk-mask-dir">
      <path d="M120 20 L166 80 L212 20" fill="none" stroke="#fff"
            stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Metade esquerda: desce até o vale e sobe até o pico do meio -->
  <path d="M28 20 L74 80 L120 20" fill="none" stroke="url(#wk-esq)"
        stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Metade direita, com a dobra escura logo abaixo do pico -->
  <g mask="url(#wk-mask-dir)">
    <rect x="0" y="0" width="240" height="100" fill="url(#wk-dir)"/>
    <polygon points="76,28.4 139.6,-20.2 171.3,21.1 107.7,69.7" fill="#0A4A21"/>
  </g>
</svg>
